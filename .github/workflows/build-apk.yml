name: Build APK

# Run from the Actions tab whenever an installable build is wanted; the
# APK is attached to the run as a downloadable artifact.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins a local JDK path that does not exist on the runner.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Name the APK after the version
        id: name
        run: |
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          name="hyper-browser-${version}-debug"
          cp app/build/outputs/apk/debug/app-debug.apk "${name}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.apk
          retention-days: 30
